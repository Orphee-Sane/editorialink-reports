                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);

                margin-bottom: 1em;

                justify-content: center;

                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
